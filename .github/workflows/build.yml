name: Build plugins

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15 # Apple Silicon (arm64)。macos-14 は 2026-11-02 に廃止
    steps:
      - uses: actions/checkout@v4

      # JUCE は git 管理外(external/JUCE は .gitignore)なので CI で取得する。
      # comp も monoral-to-steleo/external/JUCE を共用する。
      - name: Fetch JUCE 9.0.5
        run: git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git monoral-to-steleo/external/JUCE

      - name: Install Ninja
        run: brew install ninja

      - name: Build TwoStageComp
        working-directory: comp
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ./build/CurveCheck

      - name: Build MonoToStereo
        working-directory: monoral-to-steleo
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # Apple Silicon では未署名バイナリは読み込めないため ad-hoc 署名する。
      # zip は ditto で作り、バンドルの構造・権限を保つ。
      - name: Sign and package
        run: |
          mkdir -p dist
          package() {
            local dir="$1" name="$2"
            local vst3="$dir/build/${name}_artefacts/Release/VST3/${name}.vst3"
            local app="$dir/build/${name}_artefacts/Release/Standalone/${name}.app"
            codesign --force --deep -s - "$vst3"
            codesign --force --deep -s - "$app"
            ditto -c -k --keepParent "$vst3" "dist/${name}-VST3.zip"
            ditto -c -k --keepParent "$app" "dist/${name}-Standalone.zip"
          }
          package comp TwoStageComp
          package monoral-to-steleo MonoToStereo
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: plugins-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest # Visual Studio (MSVC) の x64 ビルド
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE 9.0.5
        shell: bash
        run: git clone --depth 1 --branch 9.0.5 https://github.com/juce-framework/JUCE.git monoral-to-steleo/external/JUCE

      - name: Build TwoStageComp
        shell: bash
        working-directory: comp
        run: |
          cmake -S . -B build
          cmake --build build --config Release
          ./build/Release/CurveCheck.exe

      - name: Build MonoToStereo
        shell: bash
        working-directory: monoral-to-steleo
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      # Windows の .vst3 はフォルダ形式。VST3 はフォルダごと、Standalone は exe を zip にする。
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($p in @(@('comp','TwoStageComp'), @('monoral-to-steleo','MonoToStereo'))) {
            $dir = $p[0]; $name = $p[1]
            $art = "$dir/build/${name}_artefacts/Release"
            Compress-Archive -Path "$art/VST3/$name.vst3" -DestinationPath "dist/$name-VST3.zip"
            Compress-Archive -Path "$art/Standalone/$name.exe" -DestinationPath "dist/$name-Standalone.zip"
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: plugins-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  # v* タグを push したときだけ、zip を GitHub Releases に公開する
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename per platform
        run: |
          mkdir release
          for d in artifacts/plugins-*; do
            plat="${d#artifacts/plugins-}"
            for f in "$d"/*.zip; do
              b="$(basename "$f" .zip)"
              cp "$f" "release/${b}-${plat}.zip"
            done
          done
          ls -l release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
